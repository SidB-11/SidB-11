<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Decorative animated wave" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
  </defs>
  <style>
    .a{animation:l 9s linear infinite}
    .b{animation:l 14s linear infinite reverse}
    @keyframes l{from{transform:translateX(0)}to{transform:translateX(-600px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <path class="b" d="M-600 60 C-450 20,-150 100,0 60 C150 20,450 100,600 60 C750 20,1050 100,1200 60 C1350 20,1650 100,1800 60 V120 H-600 Z" fill="url(#w)" fill-opacity=".22" transform="translate(0,14)"/>
  <path class="a" d="M-600 60 C-450 20,-150 100,0 60 C150 20,450 100,600 60 C750 20,1050 100,1200 60 C1350 20,1650 100,1800 60 V120 H-600 Z" fill="url(#w)" fill-opacity=".45"/>
</svg>
