<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hi, I'm Siddhesh</title>
  <desc id="d">Animated banner for Siddhesh, a software engineer, with a floating UI, API and AI layer stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
    <radialGradient id="gt"><stop offset="0" stop-color="#14B8A6" stop-opacity=".38"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></radialGradient>
    <radialGradient id="ga"><stop offset="0" stop-color="#F59E0B" stop-opacity=".30"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" fill-opacity=".06"/></pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
    .hello{font-size:22px;fill:#5EEAD4;fill-opacity:.85}
    .name{font-size:92px;font-weight:800}
    .tag{font-size:26px;fill:#E2E8F0}
    .lbl{font-size:18px;font-weight:700}
    .glyph{font-size:30px;font-weight:700}
    .cursor{animation:blink 1.1s steps(1) infinite}
    .float{animation:float 4s ease-in-out infinite}
    .g1{animation:d1 10s ease-in-out infinite}
    .g2{animation:d2 12s ease-in-out infinite}
    .gl{animation:float 6s ease-in-out infinite}
    .pulse{opacity:0;animation:pulse 3.4s ease-in-out infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,30px)}}
    @keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-25px)}}
    @keyframes pulse{0%{opacity:0;transform:translateY(0)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(226px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle class="g1" cx="240" cy="60" r="230" fill="url(#gt)"/>
    <circle class="g2" cx="1020" cy="290" r="250" fill="url(#ga)"/>

    <text class="mono glyph gl" x="620" y="92" fill="#2DD4BF" fill-opacity=".2" style="animation-delay:.3s">{ }</text>
    <text class="mono glyph gl" x="690" y="262" fill="#FBBF24" fill-opacity=".2" style="animation-delay:1.2s">&lt;/&gt;</text>
    <text class="mono glyph gl" x="760" y="160" fill="#8FD07C" fill-opacity=".18" style="animation-delay:2s">[ ]</text>

    <text class="mono hello" x="80" y="94">// hello, world. I'm</text>
    <text class="sans name" x="76" y="186" textLength="460" lengthAdjust="spacing" fill="url(#ink)">Siddhesh</text>
    <rect class="cursor" x="552" y="120" width="14" height="70" rx="2" fill="#FBBF24"/>
    <text class="mono tag" x="80" y="240">UI <tspan fill="#FBBF24">&#8594;</tspan> APIs <tspan fill="#FBBF24">&#8594;</tspan> AI</text>

  <g class="float" style="animation-delay:1.0s">
    <polygon points="846,214 950,262 950,276 846,228" fill="#0B1220"/><polygon points="950,262 1054,214 1054,228 950,276" fill="#0B1220"/><polygon points="950,166 1054,214 950,262 846,214" fill="#0B1220"/>
    <polygon points="846,214 950,262 950,276 846,228" fill="#FBBF24" fill-opacity=".38"/>
    <polygon points="950,262 1054,214 1054,228 950,276" fill="#FBBF24" fill-opacity=".22"/>
    <polygon points="950,166 1054,214 950,262 846,214" fill="#FBBF24" fill-opacity=".16" stroke="#FBBF24" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="950,190.0 1002.0,214 950,238.0 898.0,214" fill="none" stroke="#FBBF24" stroke-opacity=".55" stroke-width="1"/>
    <line x1="1062" y1="214" x2="1084" y2="214" stroke="#FBBF24" stroke-opacity=".6"/>
    <text class="mono lbl" x="1092" y="220" fill="#FBBF24">AI</text>
  </g>
  <g class="float" style="animation-delay:0.5s">
    <polygon points="846,156 950,204 950,218 846,170" fill="#0B1220"/><polygon points="950,204 1054,156 1054,170 950,218" fill="#0B1220"/><polygon points="950,108 1054,156 950,204 846,156" fill="#0B1220"/>
    <polygon points="846,156 950,204 950,218 846,170" fill="#8FD07C" fill-opacity=".38"/>
    <polygon points="950,204 1054,156 1054,170 950,218" fill="#8FD07C" fill-opacity=".22"/>
    <polygon points="950,108 1054,156 950,204 846,156" fill="#8FD07C" fill-opacity=".16" stroke="#8FD07C" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="950,132.0 1002.0,156 950,180.0 898.0,156" fill="none" stroke="#8FD07C" stroke-opacity=".55" stroke-width="1"/>
    <line x1="1062" y1="156" x2="1084" y2="156" stroke="#8FD07C" stroke-opacity=".6"/>
    <text class="mono lbl" x="1092" y="162" fill="#8FD07C">API</text>
  </g>
  <g class="float" style="animation-delay:0.0s">
    <polygon points="846,98 950,146 950,160 846,112" fill="#0B1220"/><polygon points="950,146 1054,98 1054,112 950,160" fill="#0B1220"/><polygon points="950,50 1054,98 950,146 846,98" fill="#0B1220"/>
    <polygon points="846,98 950,146 950,160 846,112" fill="#2DD4BF" fill-opacity=".38"/>
    <polygon points="950,146 1054,98 1054,112 950,160" fill="#2DD4BF" fill-opacity=".22"/>
    <polygon points="950,50 1054,98 950,146 846,98" fill="#2DD4BF" fill-opacity=".16" stroke="#2DD4BF" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="950,74.0 1002.0,98 950,122.0 898.0,98" fill="none" stroke="#2DD4BF" stroke-opacity=".55" stroke-width="1"/>
    <line x1="1062" y1="98" x2="1084" y2="98" stroke="#2DD4BF" stroke-opacity=".6"/>
    <text class="mono lbl" x="1092" y="104" fill="#2DD4BF">UI</text>
  </g>

    <g class="pulse"><circle cx="950" cy="40" r="11" fill="#FBBF24" fill-opacity=".3"/><circle cx="950" cy="40" r="4" fill="#fff"/></g>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="24" fill="none" stroke="#fff" stroke-opacity=".1"/>
</svg>
